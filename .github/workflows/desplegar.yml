# Despliega en Render el commit exacto de cada push a main (on demand, sin espejo ni cron).
# También se puede correr a mano desde Actions con "Run workflow".
# Requiere los secretos RENDER_API_KEY y RENDER_SERVICE_ID. Sin ellos no hace nada.
name: Desplegar en Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el deploy a Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Faltan los secretos de Render: no se despliega."
            exit 0
          fi
          respuesta=$(curl -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${GITHUB_SHA}\"}")
          echo "$respuesta" | python3 -c "import sys,json; d=json.load(sys.stdin); print('deploy', d.get('id'), d.get('status'))"

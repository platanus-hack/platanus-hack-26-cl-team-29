# Empuja main al repo espejo apenas llega un push, para que Render despliegue al momento.
# Requiere el secreto ESPEJO_TOKEN: token de grano fino del dueño del espejo, solo para ese repo,
# con permisos Contents (lectura y escritura) y Workflows (lectura y escritura).
name: Espejo al push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: espejo
  cancel-in-progress: false

jobs:
  espejo:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar el token
        id: token
        env:
          ESPEJO_TOKEN: ${{ secrets.ESPEJO_TOKEN }}
        run: |
          if [ -z "$ESPEJO_TOKEN" ]; then
            echo "Falta el secreto ESPEJO_TOKEN: no se empuja al espejo."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.listo == 'si'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Empujar al espejo
        if: steps.token.outputs.listo == 'si'
        env:
          ESPEJO_TOKEN: ${{ secrets.ESPEJO_TOKEN }}
          ESPEJO_REPO: ${{ vars.ESPEJO_REPO || 'JorgeOehrens/platanus-hack-26-cl-team-29' }}
        run: git push --force "https://x-access-token:${ESPEJO_TOKEN}@github.com/${ESPEJO_REPO}.git" HEAD:main

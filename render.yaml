services:
  - type: web
    name: app
    runtime: node
    plan: starter            # NO usar free: se duerme a los 15 min y corta los sockets
    buildCommand: npm ci && npm run build
    startCommand: node server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: KAPSO_API_KEY
        sync: false
      - key: KAPSO_PHONE_NUMBER_ID
        sync: false
      - key: KAPSO_WEBHOOK_SECRET
        sync: false
      - key: KAPSO_TEMPLATE_NAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Crédito Bando: tarjetas en el ambiente de prueba de Transbank (credenciales públicas, no cobra).
      - key: PAGOS_TRANSBANK
        value: integracion
      # Para el pitch con público: sin exigir tarjeta antes de comprar (el crédito se abre igual al facturar). Quitar para uso real.
      - key: PAGOS_EXIGIR_TARJETA
        value: "0"

databases:
  - name: db
    plan: free               # vence a los 30 días; sirve para la hackathon

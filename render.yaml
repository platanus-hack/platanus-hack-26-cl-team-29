services:
  - type: web
    name: app
    runtime: node
    plan: starter            # NO usar free: se duerme a los 15 min y corta los sockets
    buildCommand: npm ci && npm run build
    startCommand: node server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString

databases:
  - name: db
    plan: free               # vence a los 30 días; sirve para la hackathon
